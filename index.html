<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do list</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Shantell+Sans:ital,wght@0,300..800;1,300..800&family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />    
    
    <style>

        .task {
            display: flex;
            background-color: white;
            padding: 4px;
            border-bottom: solid black 1px ;
            transition: box-shadow 0.2s ;
        }

        .done{
            background-color: rgb(158, 253, 160);;
        }

        .task:hover{
            box-shadow: 0px 3px 15px rgb(97, 97, 97 , 0.843)
        }

        .circle {
            height: 25px;
            width: 25px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;   
        }


    </style>
</head>
<body>

    <div class="All-content" style="direction: rtl;">

        <!--center div-->
        <div class="center-div">

            <!--task table-->
            <div class="div-tasks">

                <div id="header" style="padding-bottom: 3px; padding-top:3px;">
                    <h3 style="display: inline;">ادارة المهام </h3>  
                    <button id="btn-add" class="circle" style="float: right; margin-right: 10px; ">
                        <span class="material-symbols-outlined">
                            add

                    </button> 
                </div>
                <!--//header-->


                <!--tasks-->

                            </div>
                        </div>
                        <!--//task-info-->

                                <span class="material-symbols-outlined">
                                    delete
                                </span>
                            </button>

                                <span class="material-symbols-outlined">

                            </button>
                            <button class="circle" style="background-color: rgb(0, 16, 97); color: white;">
